<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Melvox Studio — FLM Style DAW</title>
<style>
:root{
  --bg:#1c2026; --panel:#232830; --panel2:#2b313b; --panel3:#343b47; --line:#3b4351;
  --fg:#f0f3f8; --muted:#9aa3b2; --fl-green:#8ce63c; --fl-lime:#b4f03c; --fl-clip-txt:#142406;
  --rec:#ff4d5e; --accent:#4e6ef2;
  --t1:#8ce63c; --t2:#5ce1e6; --t3:#b4f03c; --t4:#ff9f43; --t5:#a29bfe; --t6:#fd79a8; --t7:#ffeaa7; --t8:#55efc4;
  --rowW:#242932; --rowB:#1d2129; --grid:#2e3440; --gridBar:#495366; --keyW:#e8ecf2; --keyB:#232830; --ruler:#171a20;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:12.5px;overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}

.daw{
  height:100%;display:flex;flex-direction:column;
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

.topbar{
  height:38px;background:var(--ruler);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:5px;padding:0 8px;flex:none;overflow-x:auto;scrollbar-width:none;
}
.topbar::-webkit-scrollbar{display:none}
.logo{font-weight:800;font-size:13px;letter-spacing:.03em;display:flex;align-items:center;gap:5px;flex:none;color:#fff}
.logo-dot{width:10px;height:10px;border-radius:3px;background:var(--fl-green);display:inline-block}
.mode-pill,.tool-seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.mode-pill button,.tool-seg button{background:transparent;border:0;padding:4px 9px;height:26px;font-size:11px;font-weight:700;color:var(--muted)}
.mode-pill button.active,.tool-seg button[aria-pressed="true"]{background:var(--fl-green);color:#111d05}
.mini-sel,.mini-btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;height:26px;padding:0 8px;font-size:11px;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:4px;flex:none;white-space:nowrap;font-weight:600}
.mini-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.spacer{flex:1;min-width:4px}
.readout{font-variant-numeric:tabular-nums;font-size:11px;color:var(--fl-green);background:var(--panel);padding:3px 7px;border-radius:5px;border:1px solid var(--line);font-weight:700}

.workspace{flex:1;min-height:0;display:flex;position:relative;overflow:hidden}

.playlist-view{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--bg);position:relative;contain:strict}
.pl-scroll{flex:1;min-height:0;overflow:auto;position:relative;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.pl-inner{position:relative;min-width:100%}
.pl-ruler{
  position:sticky;top:0;z-index:6;height:22px;background:var(--ruler);border-bottom:1px solid var(--line);
  display:flex;align-items:center;padding-left:64px;
}
.pl-ruler-corner{
  position:fixed;left:env(safe-area-inset-left,0px);width:64px;height:22px;background:var(--ruler);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);z-index:7;
  display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:var(--muted);
}
.pl-row{height:54px;display:flex;border-bottom:1px solid var(--grid);position:relative;contain:layout style}
.pl-head{
  position:sticky;left:0;z-index:5;width:64px;height:53px;background:var(--panel);
  border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2px;flex:none;
}
.pl-head.active{background:var(--panel3);box-shadow:inset 3px 0 0 var(--fl-green)}
.pl-head.muted{opacity:.42}
.pl-ico{font-size:14px;line-height:1}
.pl-name{font-size:9px;font-weight:700;margin-top:3px;max-width:58px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--fg)}
.pl-lane{flex:1;position:relative;height:53px;background-image:linear-gradient(to right,var(--gridBar) 1px,transparent 1px),linear-gradient(to right,var(--grid) 1px,transparent 1px)}

.fl-clip{
  position:absolute;top:4px;height:45px;border-radius:5px;padding:3px 6px;
  background:var(--fl-lime);color:var(--fl-clip-txt);border:1px solid rgba(0,0,0,.35);
  overflow:hidden;display:flex;flex-direction:column;
}
.fl-clip.audio{background:var(--fl-green)}
.fl-clip-title{font-size:9.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fl-clip canvas{width:100%;height:24px;margin-top:2px;display:block}
.pl-playhead{
  position:absolute;top:0;bottom:0;left:64px;width:2px;background:#fff;z-index:4;pointer-events:none;
  will-change:transform;
}

.pl-add-row{height:46px;display:flex;align-items:center}
.pl-add-btn{
  position:sticky;left:0;width:64px;height:46px;background:var(--panel);border:0;border-right:1px solid var(--line);
  border-bottom:1px solid var(--line);color:var(--fl-green);font-size:22px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.pl-add-hint{padding-left:12px;font-size:11px;color:var(--muted)}

.roll-view{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--rowB);position:relative;contain:strict}
.roll-view[hidden],.playlist-view[hidden],.kbd-wrap[hidden]{display:none!important}
.grid{flex:1;min-height:0;overflow:auto;position:relative;overscroll-behavior:contain}
.sizer{position:relative}
.grid canvas{position:sticky;top:0;left:0;display:block;touch-action:none}

.kbd-wrap{height:72px;background:#111419;border-top:2px solid var(--line);display:flex;flex-direction:column;flex:none;z-index:9}
.kbd-bar{height:20px;background:var(--ruler);display:flex;align-items:center;justify-content:space-between;padding:0 8px;font-size:10px;color:var(--muted);border-bottom:1px solid var(--line)}
.kbd-keys{flex:1;display:flex;position:relative;padding:2px 4px;gap:2px}
.k-white{
  flex:1;background:linear-gradient(180deg,#f5f7fa,#dce1e8);border:1px solid #8a94a6;
  border-radius:0 0 5px 5px;color:#1b2029;font-size:9px;font-weight:800;
  display:flex;align-items:flex-end;justify-content:center;padding-bottom:3px;
}
.k-white:active,.k-white.pressed{background:var(--fl-green);color:#0d1a04}
.k-black{
  width:18px;height:60%;background:linear-gradient(180deg,#2c323d,#14171d);border:1px solid #000;
  border-radius:0 0 4px 4px;color:#cfd6e3;font-size:7.5px;font-weight:700;
  position:absolute;top:2px;z-index:2;display:flex;align-items:flex-end;justify-content:center;padding-bottom:2px;
}
.k-black:active,.k-black.pressed{background:var(--accent);color:#fff}

.rack{
  width:296px;max-width:85vw;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;flex:none;z-index:12;contain:layout style;
}
.rack.collapsed{display:none}
.rack-head{display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--ruler)}
.rack-tabs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:2px;margin:6px 8px 4px;gap:2px}
.rack-tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-size:10px;font-weight:800;padding:5px 2px;border-radius:5px}
.rack-tabs button[aria-selected="true"]{background:var(--fl-green);color:#111d05}
.rack-body{flex:1;overflow-y:auto;padding:6px 10px 20px}

.plug-list{display:flex;flex-direction:column;gap:5px;margin-top:4px}
.plug-card{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);text-align:left;width:100%}
.plug-card.selected{background:linear-gradient(90deg,rgba(140,230,60,.2),var(--panel2));border-color:var(--fl-green)}
.plug-dot{width:9px;height:9px;border-radius:50%;flex:none}
.plug-info{flex:1;min-width:0}
.plug-title{font-weight:700;font-size:12px;color:var(--fg)}
.plug-sub{font-size:10px;color:var(--muted);margin-top:1px}

.sample-item{
  display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px 9px;
  background:var(--panel2);border:1px solid var(--line);border-radius:7px;margin-bottom:5px;
}
.sample-name{font-size:11.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}

.sec-title{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--fl-green);margin:11px 0 5px;font-weight:800}
.sec-title:first-child{margin-top:3px}
.row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin:5px 0}
.field{display:flex;flex-direction:column;gap:2px;flex:1;min-width:72px}
.field label,.lbl{font-size:10.5px;color:var(--muted)}
.field input,.field select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:4px 7px;height:28px;font-size:11.5px;width:100%}
.slider{display:grid;grid-template-columns:68px 1fr 38px;gap:5px;align-items:center;margin:5px 0}
.slider output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:10.5px}
input[type=range]{width:100%;accent-color:var(--fl-green)}
.vowels{display:flex;gap:4px}
.vowels button{flex:1;height:30px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);font-weight:800;font-size:12.5px}
.vowels button[aria-pressed="true"]{background:var(--fl-green);color:#111d05;border-color:var(--fl-green)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;min-height:30px;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.primary{background:var(--fl-green);border-color:var(--fl-green);color:#111d05}
.btn.danger{color:#ff6b7a;border-color:rgba(255,107,122,.35)}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.hint{color:var(--muted);font-size:10.5px;line-height:1.35;margin:3px 0}
textarea.out{width:100%;min-height:80px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px;font-family:monospace;font-size:10.5px;margin-top:5px}

.transport{
  height:48px;background:var(--ruler);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 8px;gap:5px;flex:none;z-index:11;
}
.t-group{display:flex;align-items:center;gap:5px}
.t-btn{
  height:34px;min-width:34px;padding:0 8px;border-radius:7px;background:var(--panel2);
  border:1px solid var(--line);color:var(--fg);font-weight:700;font-size:11px;
  display:inline-flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.1;
}
.t-btn small{font-size:7.5px;color:var(--muted);font-weight:700}
.t-btn[aria-pressed="true"]{background:var(--fl-green);border-color:var(--fl-green);color:#111d05}
.t-btn[aria-pressed="true"] small{color:#111d05}
.t-btn.rec-btn[aria-pressed="true"]{background:var(--rec);border-color:var(--rec);color:#fff}
.t-btn.play-circle{
  width:40px;height:40px;border-radius:50%;background:var(--panel3);border:2px solid var(--fl-green);
  color:var(--fl-green);font-size:15px;
}
.t-btn.play-circle.playing{background:var(--fl-green);color:#111d05}
.bpm-box{display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:2px 6px;height:34px}
.bpm-box input{width:38px;background:transparent;border:0;text-align:center;font-weight:800;font-size:12.5px;color:var(--fg);padding:0}
.bpm-box span{font-size:7.5px;color:var(--muted);font-weight:700}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:56px;background:var(--fl-green);color:#111d05;padding:7px 14px;border-radius:999px;font-size:11.5px;font-weight:800;max-width:90vw;z-index:40}

@media (max-width:680px) and (orientation:portrait){
  .rack{position:absolute;right:0;top:0;bottom:0}
}
</style>
</head>
<body>

<div class="daw">
  <header class="topbar">
    <div class="logo"><span class="logo-dot"></span>MELVOX</div>
    <div class="mode-pill">
      <button id="tabPlaylist" class="active">Playlist</button>
      <button id="tabRoll">Piano Roll</button>
    </div>
    <div class="tool-seg" id="tools">
      <button data-tool="draw" aria-pressed="true">Gambar</button>
      <button data-tool="move" aria-pressed="false">Pindah</button>
      <button data-tool="erase" aria-pressed="false">Hapus</button>
    </div>
    <select class="mini-sel" id="snap">
      <option value="4">1/1</option>
      <option value="2">1/2</option>
      <option value="1">1/4</option>
      <option value="0.5" selected>1/8</option>
      <option value="0.25">1/16</option>
    </select>
    <button class="mini-btn" id="toggleKeys">🎹 Keys</button>
    <button class="mini-btn" id="zoomOut">−</button>
    <button class="mini-btn" id="zoomIn">+</button>
    <div class="spacer"></div>
    <span class="readout" id="pos">1.1</span>
    <button class="mini-btn active" id="toggleRack">Rack</button>
  </header>

  <div class="workspace">
    <section class="playlist-view" id="playlistView">
      <div class="pl-ruler-corner">TRACKS</div>
      <div class="pl-scroll" id="plScroll">
        <div class="pl-inner" id="plInner"></div>
      </div>
    </section>

    <section class="roll-view" id="rollView" hidden>
      <div class="grid" id="grid">
        <div class="sizer" id="sizer"><canvas id="cv"></canvas></div>
      </div>
    </section>

    <aside class="rack" id="rack">
      <div class="rack-head">
        <strong id="rackTrackTitle" style="font-size:12px">1. Lead</strong>
        <button class="mini-btn" id="closeRack">✕</button>
      </div>
      <div class="rack-tabs">
        <button data-rtab="plugin" aria-selected="true">PLUGIN</button>
        <button data-rtab="samples" aria-selected="false">SAMPLES</button>
        <button data-rtab="effect" aria-selected="false">EFFECT</button>
        <button data-rtab="project" aria-selected="false">FILE</button>
      </div>
      <div class="rack-body" id="rackBody"></div>
    </aside>
  </div>

  <div class="kbd-wrap" id="kbdWrap" hidden>
    <div class="kbd-bar">
      <span>KEYBOARD LIVE</span>
      <div>
        <button class="mini-btn" id="kbdOctDown" style="height:18px;padding:0 6px;font-size:10px">Oct −</button>
        <span id="kbdOctLbl" style="margin:0 6px;font-weight:700;color:#fff">C4</span>
        <button class="mini-btn" id="kbdOctUp" style="height:18px;padding:0 6px;font-size:10px">Oct +</button>
      </div>
    </div>
    <div class="kbd-keys" id="kbdKeys"></div>
  </div>

  <footer class="transport">
    <div class="t-group">
      <button class="t-btn rec-btn" id="recBtn" aria-pressed="false">●<small>REC</small></button>
      <button class="t-btn" id="rew">⏮<small>REWIND</small></button>
      <button class="t-btn play-circle" id="play">▶</button>
      <div class="bpm-box"><input type="number" id="bpm" min="40" max="220" value="128" inputmode="numeric"><span>BPM</span></div>
    </div>
    <div class="t-group">
      <button class="t-btn" id="metro" aria-pressed="false">M<small>METRO</small></button>
      <button class="t-btn" id="loop" aria-pressed="false">🔁<small>LOOP</small></button>
      <button class="t-btn" id="undo" disabled>↩<small>UNDO</small></button>
      <button class="t-btn" id="quickAddSample" style="border-color:var(--fl-green);color:var(--fl-green)">+<small>SAMPLE</small></button>
    </div>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function noteName(p){return NAMES[((p%12)+12)%12]+(Math.floor(p/12)-1);}
function mtof(p){return 440*Math.pow(2,(p-69)/12);}
const VOWELS={a:[800,1200,2800],e:[400,2200,2800],i:[300,2300,3000],o:[450,800,2800],u:[300,700,2700]};
const LO=24,HI=108;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ============ MIDI & WAV Core ============ */
function vlqBytes(n){const b=[n&127];n>>>=7;while(n>0){b.push((n&127)|128);n>>>=7;}b.reverse();return b;}
function writeMidi(tracks,bpm){
  const TPB=480,out=[];
  const pushAll=(d,s)=>{for(let i=0;i<s.length;i++)d.push(s[i]);};
  const u32=n=>[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255];
  const ascii=s=>{const r=[];for(const ch of String(s)){const c=ch.charCodeAt(0);if(c>=32&&c<127)r.push(c);}return r;};
  const chunk=body=>{const c=[77,84,114,107];pushAll(c,u32(body.length));pushAll(c,body);return c;};
  const meta=(dt,type,data)=>{const e=vlqBytes(dt);e.push(255,type);pushAll(e,vlqBytes(data.length));pushAll(e,data);return e;};
  const midiTracks=tracks.filter(t=>t.inst!=='audio');
  const nt=midiTracks.length+1;
  out.push(77,84,104,100,0,0,0,6,0,1,(nt>>8)&255,nt&255,(TPB>>8)&255,TPB&255);
  const mpq=Math.round(60000000/bpm);
  const tb=[];
  pushAll(tb,meta(0,3,ascii('Tempo')));
  pushAll(tb,meta(0,0x51,[(mpq>>16)&255,(mpq>>8)&255,mpq&255]));
  pushAll(tb,meta(0,0x58,[4,2,24,8]));
  pushAll(tb,meta(0,0x2F,[]));
  pushAll(out,chunk(tb));
  let ch=0;
  midiTracks.forEach(tr=>{
    if(ch===9)ch++;
    const c=ch&15;ch++;
    const ev=[];
    tr.notes.forEach(n=>{
      const on=Math.round(n.t*TPB),off=Math.max(on+1,Math.round((n.t+n.d)*TPB));
      const v=Math.max(1,Math.min(127,(n.v|0)||90));
      ev.push([on,1,n.p,v]);ev.push([off,0,n.p,0]);
    });
    ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    const t2=[];
    pushAll(t2,meta(0,3,ascii(tr.name||'Track')));
    t2.push(0,0xC0|c,tr.inst==='piano'?0:53);
    let last=0;
    ev.forEach(e=>{pushAll(t2,vlqBytes(e[0]-last));t2.push((e[1]?0x90:0x80)|c,e[2]&127,e[3]);last=e[0];});
    pushAll(t2,meta(0,0x2F,[]));
    pushAll(out,chunk(t2));
  });
  return Uint8Array.from(out);
}

function parseMidi(u8){
  if(u8.length<14||String.fromCharCode(u8[0],u8[1],u8[2],u8[3])!=='MThd')throw new Error('Bukan file MIDI.');
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  const hl=dv.getUint32(4),ntr=dv.getUint16(10),div=dv.getUint16(12);
  if(div&0x8000||div===0)throw new Error('Format MIDI tidak didukung.');
  let pos=8+hl,bpm=null;
  const out=[];
  for(let ti=0;ti<ntr&&pos+8<=u8.length;ti++){
    const tag=String.fromCharCode(u8[pos],u8[pos+1],u8[pos+2],u8[pos+3]);
    const len=dv.getUint32(pos+4),start=pos+8,end=Math.min(start+len,u8.length);
    pos=start+len;
    if(tag!=='MTrk')continue;
    let q=start,tick=0,run=0,name='';
    const open={},byCh={};
    const readVlq=()=>{let v=0,b;do{if(q>=end)throw new Error('MIDI terpotong.');b=u8[q++];v=(v*128)+(b&127);}while(b&128);return v;};
    const close=(key,at)=>{
      const o=open[key];if(!o)return;
      delete open[key];
      (byCh[o.ch]=byCh[o.ch]||[]).push({t:o.tick/div,d:Math.max((at-o.tick)/div,1/16),p:o.p,v:o.v});
    };
    while(q<end){
      tick+=readVlq();
      let st=u8[q];
      if(st===0xFF){
        q++;const type=u8[q++];const l=readVlq();
        if(type===0x03&&!name){for(let i=0;i<l;i++){const c=u8[q+i];if(c>=32&&c<127)name+=String.fromCharCode(c);}}

function generate(o){
  const rnd=mulberry32(o.seed),sc=o.minor?[0,2,3,5,7,8,10]:[0,2,4,5,7,9,11];
  const mod=n=>((n%12)+12)%12;
  const pcOf=d=>(o.tonic+sc[((d%7)+7)%7])%12;
  const near=(pcs,target,avoid)=>{
    let best=null,bd=99;
    for(let p=target-9;p<=target+9;p++){
      if(!pcs.includes(mod(p))||(avoid!=null&&mod(p)===avoid))continue;
      const dd=Math.abs(p-target);if(dd<bd){bd=dd;best=p;}
    }
    return best;
  };
  const scalePcs=sc.map(x=>(o.tonic+x)%12);
  const scalePitches=[];
  for(let p=62;p<=81;p++)if(scalePcs.includes(mod(p)))scalePitches.push(p);
  const pats=[[1.5,.5,2],[1,1,2],[2,2],[1,1,1,1],[1.5,.5,1,1],[.5,.5,1,2],[2,1,1],[1,.5,.5,2]];
  const lead=[],alto=[],tenor=[],bass=[];
  let prev=near([o.tonic%12],69);
  for(let b=0;b<o.bars;b++){
    const last=b===o.bars-1,d=last?0:o.prog[b%o.prog.length];
    const tri=[pcOf(d),pcOf(d+2),pcOf(d+4)],base=b*4;
    const bp=near([tri[0]],45),tp=near(tri,55);
    let ap=near(tri,62,mod(tp));if(ap===null)ap=near(tri,62);if(ap<=tp)ap+=12;
    bass.push({t:base,d:1.9,p:bp,v:92},{t:base+2,d:1.9,p:bp,v:88});
    tenor.push({t:base,d:3.95,p:tp,v:78});
    alto.push({t:base,d:3.95,p:ap,v:78});
    const pat=last?[4]:pats[Math.floor(rnd()*pats.length)];
    let pos=0;
    pat.forEach(dur=>{
      let p;
      if(last)p=near([o.tonic%12],prev);
      else if(pos===0||pos===2){
        const cand=scalePitches.filter(x=>tri.includes(mod(x))).sort((x,y)=>Math.abs(x-prev)-Math.abs(y-prev));
        let i=rnd()<0.7?0:1;
        if(cand[i]===prev&&cand.length>1&&rnd()<0.6)i=(i+1)%cand.length;
        p=cand[Math.min(i,cand.length-1)];
      }else{
        let i=0,bd=99;
        scalePitches.forEach((x,k)=>{const dd=Math.abs(x-prev);if(dd<bd){bd=dd;i=k;}});
        i=Math.max(0,Math.min(scalePitches.length-1,i+[-2,-1,1,2][Math.floor(rnd()*4)]));
        p=scalePitches[i];
      }
      lead.push({t:base+pos,d:dur*0.96,p,v:100});
      prev=p;pos+=dur;
    });
  }
  return{lead,alto,tenor,bass};
}

function encodeWav(l,r,sr){
  const n=l.length,bytes=44+n*4,b=new Uint8Array(bytes),dv=new DataView(b.buffer);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);};

  dv.setUint16(20,1,true);dv.setUint16(22,2,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*4,true);
  dv.setUint16(32,4,true);dv.setUint16(34,16,true);w(36,'data');dv.setUint32(40,n*4,true);
  let o=44;
  for(let i=0;i<n;i++){

    s=Math.max(-1,Math.min(1,r[i]));dv.setInt16(o,s<0?s*32768:s*32767,true);o+=2;

/* ============ Fast Audio-to-MIDI (Zero-Crossing / AMDF Optimized) ============ */
function detectPitchFast(buf,sr){
  const N=buf.length;
  let rms=0;
  for(let i=0;i<N;i+=2)rms+=buf[i]*buf[i];
  if(Math.sqrt(rms/(N/2))<0.015)return -1;
  const minLag=Math.floor(sr/1100),maxLag=Math.min(Math.floor(sr/65),Math.floor(N/2));
  let bestLag=-1,bestDiff=1e9,zeroDiff=0;
  for(let i=0;i<maxLag;i+=2)zeroDiff+=Math.abs(buf[i]);
  for(let lag=minLag;lag<maxLag;lag+=2){
    let diff=0;
    for(let i=0;i<maxLag;i+=2)diff+=Math.abs(buf[i]-buf[i+lag]);
    if(diff<bestDiff){bestDiff=diff;bestLag=lag;}
  }
  if(bestLag<=0||bestDiff>zeroDiff*0.65)return -1;
  const freq=sr/bestLag;
  return Math.round(69+12*Math.log2(freq/440));
}
function audioBufferToMidiNotes(audioBuf,bpm,stepBeats){
  const sr=audioBuf.sampleRate,ch0=audioBuf.getChannelData(0);
  const samplesPerStep=Math.max(512,Math.floor(sr*(60/bpm)*stepBeats));
  const winSize=Math.min(1536,samplesPerStep),totalSteps=Math.floor(ch0.length/samplesPerStep);
  const notes=[];let active=null;
  for(let s=0;s<totalSteps;s++){
    const frame=ch0.subarray(s*samplesPerStep,Math.min(ch0.length,s*samplesPerStep+winSize));
    const midi=detectPitchFast(frame,sr),beat=s*stepBeats;
    if(midi>=LO&&midi<=HI){
      if(active&&active.p===midi)active.d+=stepBeats;
      else{if(active)notes.push(active);active={t:beat,d:stepBeats,p:midi,v:95};}
    }else if(active){notes.push(active);active=null;}
  }
  if(active)notes.push(active);
  return notes;
}

/* ============ Internal Sample Vault (IndexedDB) ============ */
const SampleVault={
  db:null,list:[],
  async init(){
    return new Promise(res=>{
      if(!window.indexedDB){res();return;}
      const req=indexedDB.open('MelvoxSampleVaultDB',1);
      req.onupgradeneeded=e=>{
        const db=e.target.result;
        if(!db.objectStoreNames.contains('samples'))db.createObjectStore('samples',{keyPath:'id'});
      };
      req.onsuccess=e=>{this.db=e.target.result;this.refresh().then(res);};
      req.onerror=()=>res();
    });
  },
  async refresh(){
    if(!this.db)return;
    return new Promise(res=>{
      const tx=this.db.transaction('samples','readonly');
      const req=tx.objectStore('samples').getAll();
      req.onsuccess=()=>{this.list=(req.result||[]).map(item=>({id:item.id,name:item.name,size:item.size,buf:item.buf}));res();};
      req.onerror=()=>res();
    });
  },
  async add(file){
    const arr=await file.arrayBuffer();
    const item={id:'smp_'+Date.now()+'_'+Math.random().toString(36).slice(2,6),name:file.name,size:arr.byteLength,buf:arr};
    if(this.db){
      await new Promise((res,rej)=>{
        const tx=this.db.transaction('samples','readwrite');
        tx.objectStore('samples').put(item);
        tx.oncomplete=res;tx.onerror=rej;
      });
    }
    await this.refresh();
    return item;
  },
  async remove(id){
    if(!this.db)return;
    await new Promise(res=>{
      const tx=this.db.transaction('samples','readwrite');
      tx.objectStore('samples').delete(id);
      tx.oncomplete=res;tx.onerror=res;
    });
    await this.refresh();
  },
  getById(id){return this.list.find(x=>x.id===id)||null;}
};

/* ============ Low-CPU Audio Engine (Cached IR + Lightweight Synth) ============ */
function ensureAudio(){

  if(AC.state==='suspended')AC.resume();

function getIR(ctx){
  if(sharedIR&&sharedIR.sampleRate===ctx.sampleRate)return sharedIR;
  const sec=1.6,len=Math.floor(ctx.sampleRate*sec),buf=ctx.createBuffer(2,len,ctx.sampleRate);
  for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6);}

function getNoise(ctx){
  if(sharedNoise&&sharedNoise.sampleRate===ctx.sampleRate)return sharedNoise;
  const len=Math.floor(ctx.sampleRate*0.5),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;

class Engine{

    this.bus.connect(conv);conv.connect(this.wet);this.wet.connect(this.master);
    this.master.connect(comp);comp.connect(dest);

}

  S.tracks.forEach((tr,ti)=>{
    if(tr.mute)return;
    if(tr.inst==='audio'){eng.playAudioClip(ti,startBeat,t0);return;}
    tr.notes.forEach(n=>{
      if(n.t+n.d<=startBeat)return;
      let nt=n.t,nd=n.d;
      if(nt<startBeat){nd-=startBeat-nt;nt=startBeat;}
      eng.noteOn(ti,n.p,t0+(nt-startBeat)*spb,nd*spb,n.v);
    });
  });
  if(includeMetro)eng.scheduleMetro(startBeat,songLen()+1,t0);
}
function preview(p){
  const eng=getLive();
  if(S.tracks[cur].inst==='audio')return;
  eng.noteOn(cur,p,AC.currentTime+.01,.38,105);
  if(recOn){
    const targetBeat=P.playing?qRound(P.beat):S.cursor;
    snapshot();
    S.tracks[cur].notes.push({t:targetBeat,d:snap,p,v:105});
    if(!P.playing)S.cursor+=snap;
    updPos(P.playing?P.beat:S.cursor);
    renderPlaylist();requestDraw();save();
  }
}

/* ============ Smooth 60fps Transport ============ */
let plHeadEl=null;
function play(){
  if(P.playing)stopPlay();
  const eng=getLive(),end=songLen();
  P.startBeat=S.cursor>=end?0:S.cursor;
  P.t0=AC.currentTime+.06;
  scheduleAll(eng,P.startBeat,P.t0,true);
  P.eng=eng;P.playing=true;P.beat=P.startBeat;
  const pb=$('#play');pb.textContent='■';pb.classList.add('playing');
  requestAnimationFrame(tick);
}
function stopPlay(){
  if(P.eng){P.eng.kill();P.eng=null;}
  live=null;P.playing=false;
  const pb=$('#play');pb.textContent='▶';pb.classList.remove('playing');
  updPos(S.cursor);updatePlayheads();requestDraw();
}
function tick(){
  if(!P.playing)return;
  const spb=60/S.bpm;
  P.beat=Math.max(P.startBeat,P.startBeat+(AC.currentTime-P.t0)/spb);
  updPos(P.beat);
  if(mainView==='playlist'){
    if(!plHeadEl)plHeadEl=$('#plPlayhead');
    if(plHeadEl)plHeadEl.style.transform='translate3d('+(P.beat*PL_BEAT_W)+'px,0,0)';
  }else{
    const g=$('#grid'),vis=g.clientWidth-KEYW,x=P.beat*pxBeat;
    if(x>g.scrollLeft+vis*.88||x<g.scrollLeft)g.scrollLeft=Math.max(0,x-vis*.12);
    draw();
  }
  if(P.beat>=songLen()+.5){if(loopOn)play();else stopPlay();return;}
  requestAnimationFrame(tick);
}
function updPos(b){
  const str=(Math.floor(b/4)+1)+'.'+(Math.floor(b%4)+1);
  if(str!==P.lastPosStr){P.lastPosStr=str;$('#pos').textContent=str;}
}

/* ============ 1. PLAYLIST / ARRANGEMENT VIEW ============ */
const PL_BEAT_W=34;
function renderPlaylist(){
  const inner=$('#plInner');
  const totalBeats=songLen()+8;
  const laneW=totalBeats*PL_BEAT_W;
  inner.style.width=(64+laneW)+'px';

  let rulerHtml='<div class="pl-ruler" style="width:'+(64+laneW)+'px">';
  for(let b=0;b<totalBeats;b+=4){
    rulerHtml+='<div style="position:absolute;left:'+(64+b*PL_BEAT_W)+'px;font-size:10px;font-weight:700;color:var(--muted);border-left:1px solid var(--gridBar);padding-left:4px;height:100%;display:flex;align-items:center">'+(b/4+1)+'</div>';
  }
  rulerHtml+='</div>';

  let rowsHtml='';
  S.tracks.forEach((t,i)=>{
    const ico=t.inst==='piano'?'🎹':(t.inst==='audio'?'🌊':'🎤');
    const activeCls=(i===cur?' active':'')+(t.mute?' muted':'');
    let clipsHtml='';

    if(t.inst==='audio'){
      const buf=audioStore[t.uid];
      const off=(t.audioOffset||0)*PL_BEAT_W;
      const durBeats=buf?((buf.duration*S.bpm)/60):8;
      const w=Math.max(48,durBeats*PL_BEAT_W);
      clipsHtml+='<div class="fl-clip audio" data-open-track="'+i+'" style="left:'+off+'px;width:'+w+'px">'+
        '<div class="fl-clip-title">'+(t.audioName?esc(t.audioName):'Kosong — Ketuk untuk muat Sample')+'</div>'+
        '<canvas class="pl-wave" data-uid="'+t.uid+'" width="'+Math.min(260,Math.round(w))+'" height="24"></canvas>'+
      '</div>';
    }else if(t.notes.length){
      const maxBeat=Math.max(4,Math.ceil(t.notes.reduce((m,n)=>Math.max(m,n.t+n.d),0)/16)*16);
      for(let startB=0;startB<maxBeat;startB+=16){
        const subNotes=t.notes.filter(n=>n.t>=startB&&n.t<startB+16);
        if(!subNotes.length)continue;
        const endB=Math.min(startB+16,Math.ceil(subNotes.reduce((m,n)=>Math.max(m,n.t+n.d),startB)/4)*4);
        const w=Math.max(36,(endB-startB)*PL_BEAT_W);
        clipsHtml+='<div class="fl-clip" data-open-track="'+i+'" style="left:'+(startB*PL_BEAT_W)+'px;width:'+w+'px">'+
          '<div class="fl-clip-title">'+esc(t.name)+'</div>'+
          '<canvas class="pl-midi" data-ti="'+i+'" data-sb="'+startB+'" data-eb="'+endB+'" width="'+Math.min(260,Math.round(w))+'" height="24"></canvas>'+
        '</div>';
      }
    }else{
      clipsHtml+='<div class="fl-clip" data-open-track="'+i+'" style="left:0px;width:'+(4*PL_BEAT_W)+'px;opacity:.45">'+
        '<div class="fl-clip-title">+ Ketuk isi '+esc(t.name)+'</div>'+
      '</div>';
    }

    rowsHtml+='<div class="pl-row">'+
      '<button class="pl-head'+activeCls+'" data-sel-track="'+i+'">'+
        '<span class="pl-ico">'+ico+'</span>'+
        '<span class="pl-name">'+esc(t.name)+'</span>'+
      '</button>'+
      '<div class="pl-lane" data-lane-track="'+i+'" style="width:'+laneW+'px;background-size:'+(PL_BEAT_W*4)+'px 100%, '+PL_BEAT_W+'px 100%">'+clipsHtml+'</div>'+
    '</div>';
  });

  rowsHtml+='<div class="pl-add-row">'+
    '<button class="pl-add-btn" id="plAddTrackBtn" title="Tambah Channel / Sample">+</button>'+
    '<span class="pl-add-hint">Ketuk <b>+</b> untuk tambah Sample • Ketuk klip hijau untuk buka Piano Roll</span>'+
  '</div>';

  inner.innerHTML=rulerHtml+rowsHtml+'<div class="pl-playhead" id="plPlayhead"></div>';
  plHeadEl=$('#plPlayhead');
  paintPlaylistPreviews();
  updatePlayheads();
}

function paintPlaylistPreviews(){
  document.querySelectorAll('canvas.pl-wave').forEach(cv=>{
    const buf=audioStore[cv.dataset.uid];if(!buf)return;
    const ctx=cv.getContext('2d'),d=buf.getChannelData(0),step=Math.max(1,Math.floor(d.length/cv.width));
    ctx.strokeStyle='#142406';ctx.beginPath();
    for(let x=0;x<cv.width;x+=2){
      const v=Math.abs(d[x*step]||0)*11;
      ctx.moveTo(x,12-v);ctx.lineTo(x,12+v);
    }
    ctx.stroke();
  });
  document.querySelectorAll('canvas.pl-midi').forEach(cv=>{
    const tr=S.tracks[+cv.dataset.ti];if(!tr)return;
    const sb=+cv.dataset.sb,eb=+cv.dataset.eb,span=Math.max(1,eb-sb);
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#142406';
    tr.notes.forEach(n=>{
      if(n.t<sb||n.t>=eb)return;
      const x=((n.t-sb)/span)*cv.width;
      const w=Math.max(2,(n.d/span)*cv.width);
      const y=20-((n.p-36)/60)*18;
      ctx.fillRect(x,Math.max(1,Math.min(21,y)),w,2);
    });
  });
}

function updatePlayheads(){
  const b=P.playing?P.beat:S.cursor;
  if(!plHeadEl)plHeadEl=$('#plPlayhead');
  if(plHeadEl)plHeadEl.style.transform='translate3d('+(b*PL_BEAT_W)+'px,0,0)';
}

$('#plInner').addEventListener('click',e=>{
  const addBtn=e.target.closest('#plAddTrackBtn');
  if(addBtn){openAddChannelMenu();return;}
  const head=e.target.closest('[data-sel-track]');
  if(head){cur=+head.dataset.selTrack;renderPlaylist();renderRack();return;}
  const clip=e.target.closest('[data-open-track]');
  if(clip){
    cur=+clip.dataset.openTrack;
    renderPlaylist();renderRack();
    if(S.tracks[cur].inst==='audio'){rackTab='samples';openRackDrawer();}
    else switchMainView('roll');
    return;
  }
  const lane=e.target.closest('[data-lane-track]');
  if(lane&&!P.playing){
    const rect=lane.getBoundingClientRect();
    S.cursor=Math.max(0,Math.round((e.clientX-rect.left)/PL_BEAT_W));
    updPos(S.cursor);updatePlayheads();
  }
});

function openAddChannelMenu(){
  if(S.tracks.length>=12){toast('Maksimal 12 channel');return;}
  snapshot();
  S.tracks.push(newTrack('Sample '+(S.tracks.length+1),'a',[],'audio'));
  cur=S.tracks.length-1;

/* ============ 2. PIANO ROLL VIEW (1x DPR + rAF THROTTLED) ============ */
const grid=$('#grid'),sizer=$('#sizer'),cv=$('#cv'),cx=cv.getContext('2d',{alpha:false});
let cw=300,chh=300,drawQueued=false;
const C_THEME={bg:'#1d2129',rowW:'#242932',rowB:'#1d2129',grid:'#2e3440',bar:'#495366',keyW:'#e8ecf2',keyB:'#232830',ruler:'#171a20'};

function requestDraw(){
  if(drawQueued||mainView!=='roll')return;
  drawQueued=true;
  requestAnimationFrame(()=>{drawQueued=false;draw();});
}
function sizeRoll(){
  const W=KEYW+(songLen()+16)*pxBeat,H=RULERH+(HI-LO+1)*ROWH;
  sizer.style.width=W+'px';sizer.style.height=H+'px';
  cw=Math.max(100,grid.clientWidth);chh=Math.max(100,grid.clientHeight);
  // 1x native pixel resolution eliminates 75% GPU fill-rate lag on mobile!
  cv.width=cw;cv.height=chh;
  cv.style.width=cw+'px';cv.style.height=chh+'px';
  draw();
}
function isBlack(p){return[1,3,6,8,10].includes(p%12);}
function draw(){
  if(!cw||mainView!=='roll')return;
  const sx=grid.scrollLeft,sy=grid.scrollTop,gw=cw-KEYW;
  cx.fillStyle=C_THEME.bg;cx.fillRect(0,0,cw,chh);

  const rStart=Math.max(0,Math.floor((sy-RULERH)/ROWH));
  const rEnd=Math.min(HI-LO,Math.ceil((sy+chh-RULERH)/ROWH));

  for(let r=rStart;r<=rEnd;r++){
    const p=HI-r,y=RULERH+r*ROWH-sy;
    cx.fillStyle=isBlack(p)?C_THEME.rowB:C_THEME.rowW;cx.fillRect(KEYW,y,gw,ROWH);
    cx.fillStyle=p%12===0?C_THEME.bar:C_THEME.grid;cx.fillRect(KEYW,y+ROWH-1,gw,1);
  }

  const b0=Math.floor(sx/pxBeat),b1=Math.ceil((sx+gw)/pxBeat);
  const sub=Math.min(snap,1);
  for(let b=b0;b<=b1;b++){
    const x=KEYW+b*pxBeat-sx;
    cx.fillStyle=b%4===0?C_THEME.bar:C_THEME.grid;cx.fillRect(x,RULERH,1,chh-RULERH);
    if(sub<1&&pxBeat*sub>=12){
      cx.fillStyle='#262c37';
      for(let s=sub;s<1;s+=sub)cx.fillRect(x+s*pxBeat,RULERH,1,chh-RULERH);
    }
  }

  // Notes
  for(let ti=0;ti<S.tracks.length;ti++){
    if(ti===cur)continue;
    const tr=S.tracks[ti];if(!tr||tr.inst==='audio'||!tr.notes.length)continue;
    cx.fillStyle='rgba(140,230,60,0.22)';
    for(let i=0;i<tr.notes.length;i++){
      const n=tr.notes[i],x=KEYW+n.t*pxBeat-sx,w=Math.max(4,n.d*pxBeat-1),y=RULERH+(HI-n.p)*ROWH-sy;
      if(x+w<KEYW||x>cw||y+ROWH<RULERH||y>chh)continue;
      cx.fillRect(x,y+1,w,ROWH-2);
    }
  }
  const curTr=S.tracks[cur];
  if(curTr&&curTr.inst!=='audio'){
    cx.font='bold 8.5px sans-serif';cx.textBaseline='middle';
    for(let i=0;i<curTr.notes.length;i++){
      const n=curTr.notes[i],x=KEYW+n.t*pxBeat-sx,w=Math.max(4,n.d*pxBeat-1),y=RULERH+(HI-n.p)*ROWH-sy;
      if(x+w<KEYW||x>cw||y+ROWH<RULERH||y>chh)continue;
      cx.fillStyle='#8ce63c';cx.fillRect(x,y+1,w,ROWH-2);
      if(w>18){cx.fillStyle='#142406';cx.fillText(noteName(n.p),x+3,y+ROWH/2);}
    }
  }

  const cxp=KEYW+S.cursor*pxBeat-sx;
  if(cxp>=KEYW&&cxp<=cw){cx.fillStyle='#9aa3b2';cx.fillRect(cxp,RULERH,1,chh-RULERH);}
  if(P.playing){
    const px=KEYW+P.beat*pxBeat-sx;
    if(px>=KEYW&&px<=cw){cx.fillStyle='#fff';cx.fillRect(px-1,RULERH,2,chh-RULERH);}
  }

  // Left Piano Keys with Note Names ("Show Keys on Piano Roll")
  cx.fillStyle=C_THEME.ruler;cx.fillRect(0,0,KEYW,chh);
  cx.textBaseline='middle';
  for(let r=rStart;r<=rEnd;r++){
    const p=HI-r,y=RULERH+r*ROWH-sy;
    if(isBlack(p)){
      cx.fillStyle=C_THEME.keyB;cx.fillRect(0,y,KEYW-8,ROWH-1);
      cx.fillStyle='#9aa3b2';cx.font='bold 8px sans-serif';cx.fillText(noteName(p),2,y+ROWH/2);
    }else{
      cx.fillStyle=C_THEME.keyW;cx.fillRect(0,y,KEYW-1,ROWH-1);
      cx.fillStyle=(p%12===0)?'#111827':'#4b5563';
      cx.font=(p%12===0?'bold ':'')+'8.5px sans-serif';cx.fillText(noteName(p),3,y+ROWH/2);
    }
  }

  // Top Ruler
  cx.fillStyle=C_THEME.ruler;cx.fillRect(0,0,cw,RULERH);
  cx.fillStyle=C_THEME.grid;cx.fillRect(0,RULERH-1,cw,1);
  cx.font='bold 10px sans-serif';
  for(let b=Math.floor(b0/4)*4;b<=b1;b+=4){
    const x=KEYW+b*pxBeat-sx;
    if(x<KEYW-1)continue;
    cx.fillStyle=C_THEME.bar;cx.fillRect(x,0,1,RULERH);
    cx.fillStyle='#9aa3b2';cx.fillText(String(b/4+1),x+4,RULERH/2);
  }
  cx.fillStyle=C_THEME.ruler;cx.fillRect(0,0,KEYW,RULERH);
}

function beatAt(x){return(x-KEYW+grid.scrollLeft)/pxBeat;}
function pitchAt(y){return Math.max(LO,Math.min(HI,HI-Math.floor((y-RULERH+grid.scrollTop)/ROWH)));}
function qFloor(b){return Math.max(0,Math.floor(b/snap+1e-6)*snap);}
function qRound(b){return Math.max(0,Math.round(b/snap)*snap);}
function noteAt(beat,pitch){
  const ns=S.tracks[cur].notes;
  for(let i=ns.length-1;i>=0;i--){const n=ns[i];if(n.p===pitch&&beat>=n.t&&beat<n.t+n.d)return n;}
  return null;
}

let drag=null;
const activePointers=new Map();
cv.addEventListener('pointerdown',e=>{
  ensureAudio();
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  if(activePointers.size>=2){
    const pts=[...activePointers.values()];
    drag={kind:'pan',sx:grid.scrollLeft,sy:grid.scrollTop,x0:(pts[0].x+pts[1].x)/2,y0:(pts[0].y+pts[1].y)/2};
    return;
  }
  if(y<RULERH){if(x>=KEYW&&!P.playing){S.cursor=qRound(beatAt(x));updPos(S.cursor);requestDraw();}return;}
  if(x<KEYW){preview(pitchAt(y));return;}
  const beat=beatAt(x),pitch=pitchAt(y),n=noteAt(beat,pitch);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}

  if(tool==='draw'){
    if(n){
      snapshot();
      const edge=Math.min(16,n.d*pxBeat*.4),nx=KEYW+(n.t+n.d)*pxBeat-grid.scrollLeft;
      drag=(x>=nx-edge)?{kind:'resize',n}:{kind:'move',n,off:beat-n.t};
    }else drag={kind:'pendingDraw',sx:grid.scrollLeft,sy:grid.scrollTop,x0:e.clientX,y0:e.clientY,beat,pitch};
  }else if(tool==='move'){
    if(n){
      snapshot();
      const edge=Math.min(16,n.d*pxBeat*.4),nx=KEYW+(n.t+n.d)*pxBeat-grid.scrollLeft;
      drag={kind:x>=nx-edge?'resize':'move',n,off:beat-n.t};
    }else drag={kind:'pan',sx:grid.scrollLeft,sy:grid.scrollTop,x0:e.clientX,y0:e.clientY};
  }else if(tool==='erase'){
    if(n){snapshot();drag={kind:'erase'};eraseAt(beat,pitch);}
    else drag={kind:'pan',sx:grid.scrollLeft,sy:grid.scrollTop,x0:e.clientX,y0:e.clientY};
  }
});
function eraseAt(beat,pitch){
  const n=noteAt(beat,pitch);if(!n)return;
  const ns=S.tracks[cur].notes;ns.splice(ns.indexOf(n),1);requestDraw();
}
cv.addEventListener('pointermove',e=>{
  if(activePointers.has(e.pointerId))activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!drag)return;
  if(drag.kind==='pan'){
    grid.scrollLeft=Math.max(0,drag.sx-(e.clientX-drag.x0));
    grid.scrollTop=Math.max(0,drag.sy-(e.clientY-drag.y0));
    requestDraw();return;
  }
  if(drag.kind==='pendingDraw'){
    const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
    if(Math.hypot(dx,dy)>8){
      drag.kind='pan';
      grid.scrollLeft=Math.max(0,drag.sx-dx);grid.scrollTop=Math.max(0,drag.sy-dy);
      requestDraw();
    }
    return;
  }
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,beat=beatAt(x);
  if(drag.kind==='resize')drag.n.d=Math.max(snap,qRound(beat)-drag.n.t);
  else if(drag.kind==='move'){
    drag.n.t=qRound(beat-drag.off);
    const p=pitchAt(y);if(p!==drag.n.p){drag.n.p=p;preview(p);}
  }else if(drag.kind==='erase')eraseAt(beat,pitchAt(y));
  requestDraw();
});
function endDrag(e){
  activePointers.delete(e.pointerId);
  if(!drag)return;
  if(drag.kind==='pendingDraw'){
    snapshot();
    S.tracks[cur].notes.push({t:qFloor(drag.beat),d:Math.max(snap,lastLen),p:drag.pitch,v:100});
    preview(drag.pitch);
  }
  drag=null;sizeRoll();renderPlaylist();save();
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
grid.addEventListener('scroll',()=>{if(!P.playing)requestDraw();},{passive:true});
new ResizeObserver(()=>{if(mainView==='roll')sizeRoll();}).observe(grid);

/* ============ 3. ON-SCREEN KEYBOARD ("Show Keys on Keyboard") ============ */
function renderKeyboard(){
  const wrap=$('#kbdKeys');
  $('#kbdOctLbl').textContent='C'+kbdOct;
  const startMidi=(kbdOct+1)*12;
  const whiteOffsets=[0,2,4,5,7,9,11,12,14,16,17,19,21,23];
  const blackMap=[{off:1,pos:0},{off:3,pos:1},{off:6,pos:3},{off:8,pos:4},{off:10,pos:5},{off:13,pos:7},{off:15,pos:8},{off:18,pos:10},{off:20,pos:11},{off:22,pos:12}];

  let html='';
  whiteOffsets.forEach(o=>{
    const m=startMidi+o;
    html+='<button class="k-white" data-midi="'+m+'">'+noteName(m)+'</button>';
  });
  blackMap.forEach(b=>{
    const m=startMidi+b.off;
    const leftPct=((b.pos+0.68)/whiteOffsets.length)*100;
    html+='<button class="k-black" data-midi="'+m+'" style="left:'+leftPct.toFixed(2)+'%">'+noteName(m)+'</button>';
  });
  wrap.innerHTML=html;
}
$('#kbdKeys').addEventListener('pointerdown',e=>{
  const k=e.target.closest('[data-midi]');if(!k)return;
  e.preventDefault();
  k.classList.add('pressed');
  setTimeout(()=>k.classList.remove('pressed'),160);
  preview(+k.dataset.midi);
});
$('#kbdOctDown').addEventListener('click',()=>{kbdOct=Math.max(2,kbdOct-1);renderKeyboard();});
$('#kbdOctUp').addEventListener('click',()=>{kbdOct=Math.min(6,kbdOct+1);renderKeyboard();});
$('#toggleKeys').addEventListener('click',()=>{
  const w=$('#kbdWrap'),btn=$('#toggleKeys');
  w.hidden=!w.hidden;
  btn.classList.toggle('active',!w.hidden);
  if(!w.hidden)renderKeyboard();
  if(mainView==='roll')sizeRoll();
});

        '<span class="plug-dot" style="background:'+p.color+'"></span>'+
        '<span class="plug-info"><div class="plug-title">'+p.name+'</div><div class="plug-sub">'+p.sub+'</div></span>'+
        (sel?'<span style="font-size:9.5px;color:var(--fl-green);font-weight:800">AKTIF</span>':'')+
      '</button>';
    });
    html+='</div>'+
      '<div class="sec-title">Audio to MIDI</div>'+
      '<div class="row"><span class="btn file" style="flex:1">🎙 Pilih Audio untuk di-MIDI-kan<input type="file" id="fileAudioToMidi" accept="audio/*"></span></div>';
    body.innerHTML=html;
    bindAudioToMidiInput();
    return;
  }

  if(rackTab==='samples'){
    let listHtml='';
    if(!SampleVault.list.length){
      listHtml='<p class="hint">Penyimpanan Sample APK masih kosong. Ketuk tombol hijau di atas untuk menambahkan sample WAV/MP3 ke memori aplikasi.</p>';
    }else{
      listHtml=SampleVault.list.map(item=>
        '<div class="sample-item">'+
          '<span class="sample-name" title="'+esc(item.name)+'">🎵 '+esc(item.name)+'</span>'+
          '<button class="btn primary" data-use-sample="'+item.id+'" style="min-height:24px;padding:2px 7px;font-size:10px">Pakai</button>'+
          '<button class="btn danger" data-del-sample="'+item.id+'" style="min-height:24px;padding:2px 6px;font-size:10px">✕</button>'+
        '</div>'
      ).join('');
    }
    body.innerHTML=
      '<div class="sec-title">Ruang Penyimpanan Sample APK</div>'+
      '<p class="hint">Sample tersimpan permanen di memori internal aplikasi (offline) agar mudah dipakai kapan saja.</p>'+
      '<div class="row"><span class="btn primary file" style="flex:1">+ Tambah Sample ke APK (WAV/MP3)<input type="file" id="vaultUpload" accept="audio/*" multiple></span></div>'+
      '<div class="sec-title">Daftar Sample Tersimpan ('+SampleVault.list.length+')</div>'+
      listHtml+
      (t.inst==='audio'?'<div class="sec-title">Posisi Klip Audio</div><div class="slider"><span class="lbl">Mulai Beat</span><input type="range" data-k="audioOffset" min="0" max="64" step="1" value="'+(t.audioOffset||0)+'"><output>'+(t.audioOffset||0)+' bt</output></div>':'');
    bindSampleVaultInputs();
    return;
  }

  if(rackTab==='effect'){
    const sl=(k,lab,min,max,val,suf,g)=>'<div class="slider"><span class="lbl">'+lab+'</span><input type="range" '+(g?'data-g="':'data-k="')+k+'" min="'+min+'" max="'+max+'" value="'+val+'"><output>'+val+suf+'</output></div>';
    let html='<div class="sec-title">Channel Mixer</div>'+
      '<div class="row"><div class="field"><label>Nama Track</label><input type="text" data-k="name" value="'+esc(t.name)+'" maxlength="20"></div>'+
      '<label style="display:flex;align-items:center;gap:4px;margin-top:12px"><input type="checkbox" data-k="mute"'+(t.mute?' checked':'')+'> Mute</label></div>'+
      sl('vol','Volume',0,100,Math.round(t.vol*100),'%');

    if(t.inst==='vocal'){
      const vb=Object.keys(VOWELS).map(v=>'<button data-vowel="'+v+'" aria-pressed="'+(t.vowel===v)+'">'+v.toUpperCase()+'</button>').join('');
      html+='<div class="sec-title">Formant Vokal</div><div class="vowels">'+vb+'</div>'+
        sl('uni','Unison',1,3,Math.min(3,t.uni),'')+
        sl('det','Detune',0,30,t.det,' c')+
        sl('vib','Vibrato',0,60,t.vib,' c')+
        sl('breath','Breath',0,100,Math.round(t.breath*100),'%');
    }else if(t.inst==='piano'){
      html+='<div class="sec-title">Grand Piano Tone</div>'+
        sl('brightness','Brightness',10,100,Math.round((t.brightness||0.7)*100),'%');
    }

    html+='<div class="sec-title">Edit Channel</div>'+
      '<div class="row"><button class="btn" data-act="oct-up">+1 Oktaf</button><button class="btn" data-act="oct-down">-1 Oktaf</button><button class="btn danger" data-act="clear">Kosongkan</button></div>'+
      '<div class="row"><button class="btn danger" data-act="del"'+(S.tracks.length<=1?' disabled':'')+'>Hapus Channel</button></div>'+
      '<div class="sec-title">Master Bus</div>'+
      sl('reverb','Reverb',0,100,Math.round(S.reverb*100),'%',true)+
      sl('master','Master',0,100,Math.round(S.master*100),'%',true);
    body.innerHTML=html;
    return;
  }

  if(rackTab==='project'){
    const keys=NAMES.map((n,i)=>'<option value="'+i+'"'+(i===9?' selected':'')+'>'+n+'</option>').join('');
    body.innerHTML=
      '<div class="sec-title">Generator Acapella</div>'+
      '<div class="row"><div class="field"><label>Nada</label><select id="gKey">'+keys+'</select></div>'+
      '<div class="field"><label>Mode</label><select id="gMode"><option value="minor">Minor</option><option value="major">Mayor</option></select></div></div>'+
      '<div class="row"><div class="field"><label>Progresi</label><select id="gProg"><option value="0">1-6-3-7</option><option value="1">1-4-7-3</option><option value="2">1-7-6-7</option><option value="3">1-4-5-1</option></select></div>'+
      '<div class="field"><label>Panjang</label><select id="gBars"><option value="4">4 Bar</option><option value="8" selected>8 Bar</option><option value="16">16 Bar</option></select></div></div>'+
      '<div class="row"><button class="btn primary" id="gen" style="flex:1">Generate</button><button class="btn" id="genRnd">Acak</button></div>'+
      '<div class="sec-title">Impor / Demo</div>'+
      '<div class="row"><span class="btn file" style="flex:1">Impor MIDI<input type="file" id="fileMidi" accept=".mid,.midi,audio/midi"></span>'+
      '<span class="btn file" style="flex:1">Proyek .JSON<input type="file" id="fileProj" accept=".json"></span></div>'+
      '<div class="row"><button class="btn" id="demo" style="width:100%">Muat Lagu Contoh</button></div>'+
      '<div class="sec-title">Ekspor Audio & MIDI</div>'+
      '<div class="row"><button class="btn primary" id="expWav" style="flex:1">Render WAV</button><button class="btn" id="expMidi" style="flex:1">Ekspor .MID</button></div>'+
      '<div class="row"><button class="btn" id="expProj" style="flex:1">Simpan .JSON</button><button class="btn" id="expText" style="flex:1">Teks Not</button></div>'+
      '<textarea class="out" id="noteText" readonly placeholder="Daftar not muncul di sini..."></textarea>';
    bindProjectInputs();
  }
}

$('#rackBody').addEventListener('click',async e=>{
  const plug=e.target.closest('[data-plug]');
  if(plug){
    const id=plug.dataset.plug;
    if(id==='a2m'){const inp=$('#fileAudioToMidi');if(inp)inp.click();return;}
    snapshot();
    S.tracks[cur].inst=id;
    if(id==='piano'&&S.tracks[cur].name.startsWith('Track'))S.tracks[cur].name='Grand Piano';
    if(id==='audio'){rackTab='samples';openRackDrawer();}
    renderPlaylist();renderRack();sizeRoll();save();
    return;
  }
  const useSmp=e.target.closest('[data-use-sample]');
  if(useSmp){
    const item=SampleVault.getById(useSmp.dataset.useSample);
    if(!item)return;
    try{
      ensureAudio();
      const decoded=await AC.decodeAudioData(item.buf.slice(0));
      snapshot();
      const t=S.tracks[cur];
      t.inst='audio';t.sampleId=item.id;t.audioName=item.name;
      t.name=item.name.replace(/\.[^.]+$/,'').slice(0,16);
      audioStore[t.uid]=decoded;
      renderPlaylist();renderRack();save();
      toast('Sample dipasang ke track: '+t.name);
    }catch(_){toast('Gagal memutar sample ini');}
    return;
  }
  const delSmp=e.target.closest('[data-del-sample]');
  if(delSmp){
    await SampleVault.remove(delSmp.dataset.delSample);
    renderRack();toast('Sample dihapus dari penyimpanan APK');
    return;
  }
  const v=e.target.closest('[data-vowel]');
  if(v){snapshot();S.tracks[cur].vowel=v.dataset.vowel;renderPlaylist();renderRack();if(live)live.sync();save();return;}
  const a=e.target.closest('[data-act]');
  if(a){
    const t=S.tracks[cur],act=a.dataset.act;
    snapshot();
    if(act==='oct-up'||act==='oct-down'){
      const d=act==='oct-up'?12:-12;
      t.notes.forEach(n=>{n.p=Math.max(LO,Math.min(HI,n.p+d));});
    }else if(act==='clear')t.notes=[];
    else if(act==='del'&&S.tracks.length>1){S.tracks.splice(cur,1);cur=Math.max(0,cur-1);}
    renderPlaylist();renderRack();sizeRoll();save();
  }
});

$('#rackBody').addEventListener('input',e=>{
  const el=e.target,t=S.tracks[cur];
  const k=el.dataset.k,g=el.dataset.g;
  if(g){S[g]=+el.value/100;el.nextElementSibling.textContent=el.value+'%';}
  else if(k==='name'){t.name=el.value;$('#rackTrackTitle').textContent=(cur+1)+'. '+t.name;renderPlaylist();}
  else if(k==='mute'){t.mute=el.checked;renderPlaylist();}
  else if(k==='vol'||k==='breath'||k==='brightness'){t[k]=+el.value/100;el.nextElementSibling.textContent=el.value+'%';}
  else if(k==='audioOffset'){t.audioOffset=+el.value;el.nextElementSibling.textContent=el.value+' bt';renderPlaylist();}
  else if(k){t[k]=+el.value;el.nextElementSibling.textContent=el.value+(k==='uni'?'':' c');}
  if(live&&!live.dead)live.sync();
  save();
});

function bindSampleVaultInputs(){
  const up=$('#vaultUpload');
  if(!up)return;
  up.addEventListener('change',async e=>{
    const files=[...(e.target.files||[])];e.target.value='';
    if(!files.length)return;
    let added=0;
    for(const f of files){try{await SampleVault.add(f);added++;}catch(_){}}
    renderRack();toast(added+' sample disimpan ke penyimpanan APK!');
  });
}

function bindAudioToMidiInput(){
  const fa2m=$('#fileAudioToMidi');
  if(!fa2m)return;
  fa2m.addEventListener('change',async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    toast('Menganalisis nada audio...');
    try{
      ensureAudio();
      const decoded=await AC.decodeAudioData(await f.arrayBuffer());
      const detected=audioBufferToMidiNotes(decoded,S.bpm,snap);
      if(!detected.length){toast('Tidak terdeteksi nada jelas.');return;}
      snapshot();
      const t=S.tracks[cur];
      if(t.inst==='audio')t.inst='piano';
      t.notes=detected;
      renderPlaylist();renderRack();switchMainView('roll');save();
      toast('Audio to MIDI sukses: '+detected.length+' not!');
    }catch(_){toast('Gagal mengonversi Audio to MIDI');}
  });
}

function toBase64(u8){
  let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return btoa(s);
}
async function saveFile(name,bytes,mime){
  if(window.AndroidBridge&&window.AndroidBridge.save){
    window.AndroidBridge.save('data:'+mime+';base64,'+toBase64(bytes),mime,name);
    return;
  }
  const url=URL.createObjectURL(new Blob([bytes],{type:mime}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('Mengunduh: '+name);
}
function readFile(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(new Uint8Array(r.result));r.onerror=()=>rej(new Error('Gagal membaca file.'));r.readAsArrayBuffer(file);});
}

const PROGS={minor:[[0,5,2,6],[0,3,6,2],[0,6,5,6],[0,3,4,0]],major:[[0,4,5,3],[0,5,3,4],[5,3,0,4],[0,3,5,4]]};
function bindProjectInputs(){
  $('#gen').addEventListener('click',()=>{
    const minor=$('#gMode').value==='minor';
    const d=generate({tonic:+$('#gKey').value,minor,prog:PROGS[$('#gMode').value][+$('#gProg').value],bars:+$('#gBars').value,seed});
    snapshot();if(P.playing)stopPlay();
    setSong(d,null);refreshAll();save();
    toast('Lagu baru dibuat!');
  });
  $('#genRnd').addEventListener('click',()=>{seed=Math.floor(Math.random()*1e6);$('#gen').click();});
  $('#demo').addEventListener('click',()=>{
    snapshot();if(P.playing)stopPlay();
    setSong(demoSong(),128);refreshAll();save();
    toast('Lagu contoh dimuat');
  });
  $('#fileMidi').addEventListener('change',async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    try{
      const m=parseMidi(await readFile(f));
      if(!m.tracks.length)throw new Error('Tidak ada not.');
      snapshot();
      S.tracks=m.tracks.slice(0,8).map((t,i)=>newTrack(t.name||('Track '+(i+1)),['a','o','o','u','e','i','a','o'][i%8],t.notes,i===1?'piano':'vocal'));
      S.bpm=Math.max(40,Math.min(220,m.bpm));cur=0;S.cursor=0;
      if(P.playing)stopPlay();refreshAll();save();
      toast('MIDI dimuat: '+S.tracks.length+' track');
    }catch(err){toast(err.message||'Gagal membuka MIDI');}
  });
  $('#fileProj').addEventListener('change',async e=>{
    const f=e.target.files[0];e.target.value='';if(!f)return;
    try{
      const o=JSON.parse(new TextDecoder().decode(await readFile(f)));
      snapshot();applyProject(o);if(P.playing)stopPlay();refreshAll();save();
      toast('Proyek dimuat');
    }catch(_){toast('File proyek tidak valid');}
  });
  $('#expWav').addEventListener('click',async()=>{
    toast('Merender WAV...');
    try{
      const sr=44100,sec=songLen()*60/S.bpm+2.8;
      const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
      const oc=new OC(2,Math.ceil(sr*sec),sr);
      const eng=new Engine(oc,oc.destination,S);
      scheduleAll(eng,0,.05,false);
      const buf=await oc.startRendering();
      await saveFile('melvox-export.wav',encodeWav(buf.getChannelData(0),buf.getChannelData(1),sr),'audio/wav');
    }catch(_){toast('Gagal render WAV');}
  });
  $('#expMidi').addEventListener('click',()=>saveFile('melvox-project.mid',writeMidi(S.tracks,S.bpm),'audio/midi'));
  $('#expProj').addEventListener('click',()=>saveFile('melvox-project.json',new TextEncoder().encode(JSON.stringify({bpm:S.bpm,reverb:S.reverb,master:S.master,tracks:S.tracks})),'application/json'));
  $('#expText').addEventListener('click',()=>{
    const t=S.tracks[cur];
    $('#noteText').value=t.name+' ('+S.bpm+' BPM)\n'+t.notes.map(n=>(Math.floor(n.t/4)+1)+'.'+(Math.round((n.t%4+1)*100)/100)+' '+noteName(n.p)+' ('+n.d+')').join('\n');
  });
}

/* ============ Navigation & Controls ============ */
function switchMainView(v){
  mainView=v;
  $('#tabPlaylist').classList.toggle('active',v==='playlist');
  $('#tabRoll').classList.toggle('active',v==='roll');
  $('#playlistView').hidden=(v!=='playlist');
  $('#rollView').hidden=(v!=='roll');
  if(v==='roll'){
    sizeRoll();
    const t=S.tracks[cur];
    const avg=(t&&t.notes.length)?t.notes.reduce((a,n)=>a+n.p,0)/t.notes.length:64;
    grid.scrollTop=Math.max(0,RULERH+(HI-avg)*ROWH-grid.clientHeight/2);
    requestDraw();
  }else{
    renderPlaylist();
  }
}

$('#tabPlaylist').addEventListener('click',()=>switchMainView('playlist'));
$('#tabRoll').addEventListener('click',()=>switchMainView('roll'));

document.querySelectorAll('#tools button').forEach(b=>b.addEventListener('click',()=>{
  tool=b.dataset.tool;
  document.querySelectorAll('#tools button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  if(mainView!=='roll')switchMainView('roll');
}));
document.querySelectorAll('.rack-tabs button').forEach(b=>b.addEventListener('click',()=>{
  rackTab=b.dataset.rtab;
  document.querySelectorAll('.rack-tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  renderRack();
}));
$('#toggleRack').addEventListener('click',()=>{
  const r=$('#rack');r.classList.toggle('collapsed');
  $('#toggleRack').classList.toggle('active',!r.classList.contains('collapsed'));
  if(mainView==='roll')sizeRoll();
});
$('#closeRack').addEventListener('click',()=>{
  $('#rack').classList.add('collapsed');
  $('#toggleRack').classList.remove('active');
  if(mainView==='roll')sizeRoll();
});
$('#snap').addEventListener('change',e=>{snap=+e.target.value;requestDraw();});
function zoom(f){
  const c=(grid.scrollLeft+(cw-KEYW)/2)/pxBeat;
  pxBeat=Math.max(22,Math.min(180,Math.round(pxBeat*f)));
  sizeRoll();grid.scrollLeft=Math.max(0,c*pxBeat-(cw-KEYW)/2);requestDraw();
}
$('#zoomIn').addEventListener('click',()=>zoom(1.3));
$('#zoomOut').addEventListener('click',()=>zoom(1/1.3));

$('#play').addEventListener('click',()=>{ensureAudio();P.playing?stopPlay():play();});
$('#rew').addEventListener('click',()=>{S.cursor=0;grid.scrollLeft=0;$('#plScroll').scrollLeft=0;updPos(0);updatePlayheads();if(P.playing)play();else requestDraw();});
$('#recBtn').addEventListener('click',e=>{
  recOn=!recOn;e.currentTarget.setAttribute('aria-pressed',recOn);
  if(recOn&&$('#kbdWrap').hidden)$('#toggleKeys').click();
  toast(recOn?'Mode Rekam (REC) aktif — mainkan tuts keyboard!':'Mode Rekam dimatikan');
});
$('#loop').addEventListener('click',e=>{loopOn=!loopOn;e.currentTarget.setAttribute('aria-pressed',loopOn);});
$('#metro').addEventListener('click',e=>{metroOn=!metroOn;e.currentTarget.setAttribute('aria-pressed',metroOn);});
$('#undo').addEventListener('click',undo);
$('#quickAddSample').addEventListener('click',openAddChannelMenu);
$('#bpm').addEventListener('change',e=>{
  const v=Math.max(40,Math.min(220,Math.round(+e.target.value||S.bpm)));
  if(v!==S.bpm){snapshot();S.bpm=v;if(P.playing)stopPlay();save();}
  e.target.value=S.bpm;
});

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
let toastT=0;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},3200);
}

function refreshAll(){
  $('#bpm').value=S.bpm;
  renderPlaylist();
  renderRack();
  updPos(S.cursor);
  if(mainView==='roll')sizeRoll();
}

(async()=>{
  await SampleVault.init();
  if(!loadSaved())setSong(demoSong(),128);
  refreshAll();
  await restoreVaultSamplesForTracks();
})();
</script>
