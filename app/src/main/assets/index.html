<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Melvox Studio — Mobile DAW</title>
<style>
:root{
  --bg:#0b0d11; --panel:#12161d; --panel2:#191f29; --panel3:#212836; --line:#27303f;
  --fg:#eef1f6; --muted:#8894a6; --accent:#4e6ef2; --accent2:#ff9b54; --play:#2ee57a; --play-fg:#062312; --danger:#ff5c6c;
  --t1:#f59e0b; --t2:#10b981; --t3:#3b82f6; --t4:#ec4899; --t5:#8b5cf6; --t6:#06b6d4; --t7:#84cc16; --t8:#f97316;
  --rowW:#151a23; --rowB:#10141b; --grid:#1f2734; --gridBar:#344156; --keyW:#dce1ea; --keyB:#252c38; --keyTxt:#5a6578; --ruler:#0e1218;
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;padding:0;background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;overflow:hidden;user-select:none}
button,input,select,textarea{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}

.daw{
  height:100%;display:flex;flex-direction:column;
  padding-left:env(safe-area-inset-left,0px);
  padding-right:env(safe-area-inset-right,0px);
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}

.topbar{
  height:40px;background:var(--panel);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:5px;padding:0 8px;flex:none;overflow-x:auto;scrollbar-width:none;
}
.topbar::-webkit-scrollbar{display:none}
.logo{font-weight:700;font-size:13px;letter-spacing:.02em;display:flex;align-items:center;gap:5px;margin-right:2px;flex:none}
.logo-badge{background:linear-gradient(135deg,#4e6ef2,#8b5cf6);color:#fff;font-size:9px;padding:2px 5px;border-radius:4px;font-weight:700}
.tool-seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.tool-seg button{background:transparent;border:0;border-right:1px solid var(--line);padding:4px 8px;height:28px;font-size:11.5px;color:var(--muted);font-weight:500;white-space:nowrap}
.tool-seg button:last-child{border-right:0}
.tool-seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.mini-sel,.mini-btn{background:var(--panel2);border:1px solid var(--line);border-radius:7px;height:28px;padding:0 8px;font-size:11.5px;color:var(--fg);display:inline-flex;align-items:center;justify-content:center;gap:4px;flex:none;white-space:nowrap}
.mini-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.spacer{flex:1;min-width:4px}
.readout{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted);background:var(--bg);padding:4px 7px;border-radius:6px;border:1px solid var(--line);flex:none}

.workspace{flex:1;min-height:0;display:flex;position:relative;overflow:hidden}

.sidebar{
  width:60px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;padding:6px 4px;gap:6px;
  overflow-y:auto;flex:none;z-index:5;scrollbar-width:none;
}
.sidebar::-webkit-scrollbar{display:none}
.ch-item{
  width:48px;height:48px;border-radius:10px;border:2px solid transparent;
  background:var(--panel2);display:flex;flex-direction:column;align-items:center;justify-content:center;
  position:relative;flex:none;padding:2px;
}
.ch-item.active{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.18)}
.ch-item.muted{opacity:.4}
.ch-icon{font-size:16px;line-height:1}
.ch-lbl{font-size:9px;font-weight:700;margin-top:3px;max-width:42px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.ch-type{position:absolute;top:2px;right:3px;font-size:7.5px;opacity:.9;font-weight:700;color:#fff}
.ch-add{
  width:48px;height:40px;border-radius:10px;border:1px dashed var(--line);
  background:transparent;color:var(--muted);font-size:20px;display:flex;align-items:center;justify-content:center;flex:none;
}

.center{flex:1;min-width:0;display:flex;flex-direction:column;background:var(--rowB);position:relative}
.grid{flex:1;min-height:0;overflow:auto;position:relative;overscroll-behavior:contain}
.sizer{position:relative}
.grid canvas{position:sticky;top:0;left:0;display:block;touch-action:none}

.rack{
  width:290px;max-width:84vw;background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;flex:none;z-index:8;
}
.rack.collapsed{display:none}
.rack-head{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;border-bottom:1px solid var(--line)}
.rack-tabs{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px;margin:7px 10px 4px}
.rack-tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-size:11px;font-weight:700;padding:5px 4px;border-radius:999px}
.rack-tabs button[aria-selected="true"]{background:var(--panel3);color:#fff}
.rack-body{flex:1;overflow-y:auto;padding:8px 10px 20px}

.plug-list{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.plug-card{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);text-align:left;width:100%}
.plug-card.selected{background:linear-gradient(90deg,rgba(78,110,242,.24),var(--panel2));border-color:var(--accent)}
.plug-dot{width:10px;height:10px;border-radius:50%;flex:none}
.plug-info{flex:1;min-width:0}
.plug-title{font-weight:700;font-size:12.5px;color:var(--fg)}
.plug-sub{font-size:10.5px;color:var(--muted);margin-top:1px}

.sec-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:12px 0 6px;font-weight:700}
.sec-title:first-child{margin-top:4px}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:6px 0}
.field{display:flex;flex-direction:column;gap:3px;flex:1;min-width:75px}
.field label,.lbl{font-size:11px;color:var(--muted)}
.field input,.field select{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:5px 8px;height:30px;font-size:12px;width:100%}
.slider{display:grid;grid-template-columns:72px 1fr 36px;gap:6px;align-items:center;margin:6px 0}
.slider output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:11px}
input[type=range]{width:100%;accent-color:var(--accent)}
.vowels{display:flex;gap:4px}
.vowels button{flex:1;height:32px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:13px}
.vowels button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-height:32px;font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:rgba(255,92,108,.35)}
.btn:disabled{opacity:.4}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.hint{color:var(--muted);font-size:11px;line-height:1.4;margin:4px 0}
textarea.out{width:100%;min-height:90px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px;font-family:monospace;font-size:11px;margin-top:6px}
.wave-box{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px;margin:6px 0}
.wave-box canvas{width:100%;height:44px;display:block}

.transport{
  height:46px;background:var(--panel);border-top:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;padding:0 6px;gap:4px;flex:none;z-index:10;
}
.t-group{display:flex;align-items:center;gap:4px}
.t-btn{
  height:32px;min-width:32px;padding:0 8px;border-radius:8px;background:var(--panel2);
  border:1px solid var(--line);color:var(--fg);font-weight:700;font-size:11.5px;
  display:inline-flex;align-items:center;justify-content:center;
}
.t-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.t-btn.play-main{
  background:var(--play);color:var(--play-fg);border-color:var(--play);
  min-width:56px;height:34px;font-size:14px;font-weight:700;
}
.t-btn.play-main.playing{background:#ff5c6c;border-color:#ff5c6c;color:#fff}
.bpm-box{display:flex;align-items:center;gap:3px;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px 5px;height:32px}
.bpm-box span{font-size:9.5px;color:var(--muted);font-weight:700}
.bpm-box input{width:38px;background:transparent;border:0;text-align:center;font-weight:700;font-size:12px;color:var(--fg)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:54px;background:var(--fg);color:var(--bg);padding:7px 13px;border-radius:999px;font-size:11.5px;font-weight:700;max-width:90vw;z-index:30}

@media (max-width:680px) and (orientation:portrait){
  .rack{position:absolute;right:0;top:0;bottom:0;box-shadow:-12px 0 32px rgba(0,0,0,.65)}
}
</style>
</head>
<body>

<div class="daw">
  <header class="topbar">
    <div class="logo">MELVOX <span class="logo-badge">DAW</span></div>
    <div class="tool-seg" id="tools">
      <button data-tool="draw" aria-pressed="true">Gambar</button>
      <button data-tool="move" aria-pressed="false">Pindah</button>
      <button data-tool="erase" aria-pressed="false">Hapus</button>
    </div>
    <select class="mini-sel" id="snap">
      <option value="4">1/1</option>
      <option value="2">1/2</option>
      <option value="1">1/4</option>
      <option value="0.5" selected>1/8</option>
      <option value="0.25">1/16</option>
    </select>
    <button class="mini-btn" id="zoomOut">−</button>
    <button class="mini-btn" id="zoomIn">+</button>
    <div class="spacer"></div>
    <span class="readout" id="pos">1.1</span>
    <button class="mini-btn active" id="toggleRack">Rack</button>
  </header>

  <div class="workspace">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="center">
      <div class="grid" id="grid">
        <div class="sizer" id="sizer"><canvas id="cv"></canvas></div>
      </div>
    </main>
    <aside class="rack" id="rack">
      <div class="rack-head">
        <strong id="rackTrackTitle" style="font-size:12.5px">Track 1</strong>
        <button class="mini-btn" id="closeRack">✕</button>
      </div>
      <div class="rack-tabs">
        <button data-rtab="plugin" aria-selected="true">PLUGIN</button>
        <button data-rtab="effect" aria-selected="false">EFFECT</button>
        <button data-rtab="project" aria-selected="false">PROJECT</button>
      </div>
      <div class="rack-body" id="rackBody"></div>
    </aside>
  </div>

  <footer class="transport">
    <div class="t-group">
      <button class="t-btn" id="metro" aria-pressed="false">M</button>
      <button class="t-btn" id="loop" aria-pressed="false">Loop</button>
      <div class="bpm-box"><span>BPM</span><input type="number" id="bpm" min="40" max="220" value="90" inputmode="numeric"></div>
    </div>
    <div class="t-group">
      <button class="t-btn" id="rew">⏮</button>
      <button class="t-btn play-main" id="play">▶</button>
      <button class="t-btn" id="ffw">⏭</button>
    </div>
    <div class="t-group">
      <button class="t-btn" id="undo" disabled>↩</button>
      <button class="t-btn" id="quickExport">WAV</button>
    </div>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function noteName(p){return NAMES[((p%12)+12)%12]+(Math.floor(p/12)-1);}
function mtof(p){return 440*Math.pow(2,(p-69)/12);}
const VOWELS={a:[800,1200,2800],e:[400,2200,2800],i:[300,2300,3000],o:[450,800,2800],u:[300,700,2700]};
const LO=24,HI=108;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function vlqBytes(n){const b=[n&127];n>>>=7;while(n>0){b.push((n&127)|128);n>>>=7;}b.reverse();return b;}
function writeMidi(tracks,bpm){
  const TPB=480,out=[];
  const pushAll=(d,s)=>{for(let i=0;i<s.length;i++)d.push(s[i]);};
  const u32=n=>[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255];
  const ascii=s=>{const r=[];for(const ch of String(s)){const c=ch.charCodeAt(0);if(c>=32&&c<127)r.push(c);}return r;};
  const chunk=body=>{const c=[77,84,114,107];pushAll(c,u32(body.length));pushAll(c,body);return c;};
  const meta=(dt,type,data)=>{const e=vlqBytes(dt);e.push(255,type);pushAll(e,vlqBytes(data.length));pushAll(e,data);return e;};
  const midiTracks=tracks.filter(t=>t.inst!=='audio');
  const nt=midiTracks.length+1;
  out.push(77,84,104,100,0,0,0,6,0,1,(nt>>8)&255,nt&255,(TPB>>8)&255,TPB&255);
  const mpq=Math.round(60000000/bpm);
  const tb=[];
  pushAll(tb,meta(0,3,ascii('Tempo')));
  pushAll(tb,meta(0,0x51,[(mpq>>16)&255,(mpq>>8)&255,mpq&255]));
  pushAll(tb,meta(0,0x58,[4,2,24,8]));
  pushAll(tb,meta(0,0x2F,[]));
  pushAll(out,chunk(tb));
  let ch=0;
  midiTracks.forEach(tr=>{
    if(ch===9)ch++;
    const c=ch&15;ch++;
    const ev=[];
    tr.notes.forEach(n=>{
      const on=Math.round(n.t*TPB),off=Math.max(on+1,Math.round((n.t+n.d)*TPB));
      const v=Math.max(1,Math.min(127,(n.v|0)||90));
      ev.push([on,1,n.p,v]);ev.push([off,0,n.p,0]);
    });
    ev.sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    const t2=[];
    pushAll(t2,meta(0,3,ascii(tr.name||'Track')));
    t2.push(0,0xC0|c,tr.inst==='piano'?0:53);
    let last=0;
    ev.forEach(e=>{pushAll(t2,vlqBytes(e[0]-last));t2.push((e[1]?0x90:0x80)|c,e[2]&127,e[3]);last=e[0];});
    pushAll(t2,meta(0,0x2F,[]));
    pushAll(out,chunk(t2));
  });
  return Uint8Array.from(out);
}

function parseMidi(u8){
  if(u8.length<14||String.fromCharCode(u8[0],u8[1],u8[2],u8[3])!=='MThd')throw new Error('Bukan file MIDI.');
  const dv=new DataView(u8.buffer,u8.byteOffset,u8.byteLength);
  const hl=dv.getUint32(4),ntr=dv.getUint16(10),div=dv.getUint16(12);
  if(div&0x8000)throw new Error('SMPTE tidak didukung.');
  if(div===0)throw new Error('File MIDI rusak.');
  let pos=8+hl,bpm=null,skippedDrums=0;
  const out=[];
  for(let ti=0;ti<ntr&&pos+8<=u8.length;ti++){
    const tag=String.fromCharCode(u8[pos],u8[pos+1],u8[pos+2],u8[pos+3]);
    const len=dv.getUint32(pos+4),start=pos+8,end=Math.min(start+len,u8.length);
    pos=start+len;
    if(tag!=='MTrk')continue;
    let q=start,tick=0,run=0,name='';
    const open={},byCh={};
    const readVlq=()=>{let v=0,b;do{if(q>=end)throw new Error('MIDI terpotong.');b=u8[q++];v=(v*128)+(b&127);}while(b&128);return v;};
    const close=(key,at)=>{
      const o=open[key];if(!o)return;
      delete open[key];
      (byCh[o.ch]=byCh[o.ch]||[]).push({t:o.tick/div,d:Math.max((at-o.tick)/div,1/16),p:o.p,v:o.v});
    };
    while(q<end){
      tick+=readVlq();
      let st=u8[q];
      if(st===0xFF){
        q++;const type=u8[q++];const l=readVlq();
        if(type===0x03&&!name){for(let i=0;i<l;i++){const c=u8[q+i];if(c>=32&&c<127)name+=String.fromCharCode(c);}}
        if(type===0x51&&l===3&&bpm===null){const mpq=(u8[q]<<16)|(u8[q+1]<<8)|u8[q+2];if(mpq>0)bpm=Math.round(60000000/mpq);}
        q+=l;
        if(type===0x2F)break;
        continue;
      }
      if(st===0xF0||st===0xF7){q++;const l=readVlq();q+=l;continue;}
      if(st&0x80){run=st;q++;}else{st=run;if(!st)throw new Error('MIDI rusak.');}
      const type=st&0xF0,ch=st&15;
      if(type===0xC0||type===0xD0){q+=1;continue;}
      const a=u8[q++],b=u8[q++];
      if(type===0x90&&b>0){close(ch*128+a,tick);open[ch*128+a]={tick,ch,p:a,v:b};}
      else if(type===0x80||type===0x90){close(ch*128+a,tick);}
    }
    Object.keys(open).forEach(k=>close(k,tick));
    const chans=Object.keys(byCh);
    chans.forEach(c=>{
      const notes=byCh[c];
      if(+c===9){skippedDrums+=notes.length;return;}
      notes.sort((x,y)=>x.t-y.t||x.p-y.p);
      out.push({name:(name||('Track '+(out.length+1)))+(chans.length>1?' ch'+(+c+1):''),notes});
    });
  }
  return{bpm:bpm||120,tracks:out,skippedDrums};
}

function generate(o){
  const rnd=mulberry32(o.seed),sc=o.minor?[0,2,3,5,7,8,10]:[0,2,4,5,7,9,11];
  const mod=n=>((n%12)+12)%12;
  const pcOf=d=>(o.tonic+sc[((d%7)+7)%7])%12;
  const near=(pcs,target,avoid)=>{
    let best=null,bd=99;
    for(let p=target-9;p<=target+9;p++){
      if(!pcs.includes(mod(p))||(avoid!=null&&mod(p)===avoid))continue;
      const dd=Math.abs(p-target);if(dd<bd){bd=dd;best=p;}
    }
    return best;
  };
  const scalePcs=sc.map(x=>(o.tonic+x)%12);
  const scalePitches=[];
  for(let p=62;p<=81;p++)if(scalePcs.includes(mod(p)))scalePitches.push(p);
  const pats=[[1.5,.5,2],[1,1,2],[2,2],[1,1,1,1],[1.5,.5,1,1],[.5,.5,1,2],[2,1,1],[1,.5,.5,2]];
  const lead=[],alto=[],tenor=[],bass=[];
  let prev=near([o.tonic%12],69);
  for(let b=0;b<o.bars;b++){
    const last=b===o.bars-1,d=last?0:o.prog[b%o.prog.length];
    const tri=[pcOf(d),pcOf(d+2),pcOf(d+4)],base=b*4;
    const bp=near([tri[0]],45),tp=near(tri,55);
    let ap=near(tri,62,mod(tp));if(ap===null)ap=near(tri,62);if(ap<=tp)ap+=12;
    bass.push({t:base,d:1.9,p:bp,v:92},{t:base+2,d:1.9,p:bp,v:88});
    tenor.push({t:base,d:3.95,p:tp,v:78});
    alto.push({t:base,d:3.95,p:ap,v:78});
    const pat=last?[4]:pats[Math.floor(rnd()*pats.length)];
    let pos=0;
    pat.forEach(dur=>{
      let p;
      if(last){p=near([o.tonic%12],prev);}
      else if(pos===0||pos===2){
        const cand=scalePitches.filter(x=>tri.includes(mod(x))).sort((x,y)=>Math.abs(x-prev)-Math.abs(y-prev));
        let i=rnd()<0.7?0:1;
        if(cand[i]===prev&&cand.length>1&&rnd()<0.6)i=(i+1)%cand.length;
        p=cand[Math.min(i,cand.length-1)];
      }else{
        let i=0,bd=99;
        scalePitches.forEach((x,k)=>{const dd=Math.abs(x-prev);if(dd<bd){bd=dd;i=k;}});
        i=Math.max(0,Math.min(scalePitches.length-1,i+[-2,-1,1,2][Math.floor(rnd()*4)]));
        p=scalePitches[i];
      }
      lead.push({t:base+pos,d:dur*0.96,p,v:100});
      prev=p;pos+=dur;
    });
  }
  return{lead,alto,tenor,bass};
}

function encodeWav(l,r,sr){
  const n=l.length,bytes=44+n*4,b=new Uint8Array(bytes),dv=new DataView(b.buffer);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)b[o+i]=s.charCodeAt(i);};
  w(0,'RIFF');dv.setUint32(4,bytes-8,true);w(8,'WAVEfmt ');dv.setUint32(16,16,true);
  dv.setUint16(20,1,true);dv.setUint16(22,2,true);dv.setUint32(24,sr,true);dv.setUint32(28,sr*4,true);

function detectPitchAC(buf,sr){
  const SIZE=buf.length;
  let rms=0;
  for(let i=0;i<SIZE;i++){const v=buf[i];rms+=v*v;}
  rms=Math.sqrt(rms/SIZE);
  if(rms<0.015)return -1;
  let r1=0,r2=SIZE-1,thres=0.2;
  for(let i=0;i<SIZE/2;i++){if(Math.abs(buf[i])<thres){r1=i;break;}}
  for(let i=1;i<SIZE/2;i++){if(Math.abs(buf[SIZE-i])<thres){r2=SIZE-i;break;}}
  const slice=buf.subarray(r1,r2);
  const N=slice.length;
  if(N<64)return -1;
  const c=new Float32Array(N);
  for(let i=0;i<N;i++){
    let sum=0;
    for(let j=0;j<N-i;j++)sum+=slice[j]*slice[j+i];
    c[i]=sum;
  }
  let d=0;while(d<N-1&&c[d]>c[d+1])d++;
  let maxval=-1,maxpos=-1;
  for(let i=d;i<N;i++){if(c[i]>maxval){maxval=c[i];maxpos=i;}}
  if(maxpos<=0||maxval<c[0]*0.35)return -1;
  const freq=sr/maxpos;
  if(freq<65||freq>1400)return -1;
  return Math.round(69+12*Math.log2(freq/440));
}

function audioBufferToMidiNotes(audioBuf,bpm,stepBeats){
  const sr=audioBuf.sampleRate;
  const ch0=audioBuf.getChannelData(0);
  const secPerStep=(60/bpm)*stepBeats;
  const samplesPerStep=Math.max(512,Math.floor(sr*secPerStep));
  const winSize=Math.min(2048,samplesPerStep);
  const totalSteps=Math.floor(ch0.length/samplesPerStep);
  const notes=[];
  let active=null;
  for(let s=0;s<totalSteps;s++){
    const start=s*samplesPerStep;
    const frame=ch0.subarray(start,Math.min(ch0.length,start+winSize));
    const midi=detectPitchAC(frame,sr);
    const beat=s*stepBeats;
    if(midi>=LO&&midi<=HI){
      if(active&&active.p===midi)active.d+=stepBeats;

    }else{if(active){notes.push(active);active=null;}}
  }
  if(active)notes.push(active);
  return notes;
}

    cx.globalAlpha=ti===cur?1:.26;
    tr.notes.forEach(n=>{
      const x=KEYW+n.t*pxBeat-sx,w=Math.max(4,n.d*pxBeat-1),y=RULERH+(HI-n.p)*ROWH-sy;
      if(x+w<KEYW||x>cw||y+ROWH<RULERH||y>chh)return;
      cx.fillRect(x,y+1,w,ROWH-2);
    });
    cx.globalAlpha=1;
  });

  const cxp=KEYW+S.cursor*pxBeat-sx;
  if(cxp>=KEYW&&cxp<=cw){cx.fillStyle=C.muted;cx.fillRect(cxp,RULERH,1,chh-RULERH);}
  if(P.playing){
    const px=KEYW+P.beat*pxBeat-sx;
    if(px>=KEYW&&px<=cw){cx.fillStyle='#2ee57a';cx.fillRect(px-1,RULERH,2,chh-RULERH);}
  }

  cx.fillStyle=C.ruler;cx.fillRect(0,0,KEYW,chh);
  for(let r=0;r<=HI-LO;r++){
    const p=HI-r,y=RULERH+r*ROWH-sy;
    if(y+ROWH<RULERH||y>chh)continue;
    if(isBlack(p)){cx.fillStyle=C.keyB;cx.fillRect(0,y,KEYW-9,ROWH-1);}
    else{cx.fillStyle=C.keyW;cx.fillRect(0,y,KEYW-1,ROWH-1);}
    if(p%12===0){cx.fillStyle=C.keyTxt;cx.font='bold 9px sans-serif';cx.textBaseline='middle';cx.fillText(noteName(p),3,y+ROWH/2);}
  }

  cx.fillStyle=C.ruler;cx.fillRect(0,0,cw,RULERH);
  cx.fillStyle=C.grid;cx.fillRect(0,RULERH-1,cw,1);
  cx.font='bold 10px sans-serif';cx.textBaseline='middle';
  for(let b=Math.floor(b0/4)*4;b<=b1;b+=4){
    const x=KEYW+b*pxBeat-sx;
    if(x<KEYW-1)continue;
    cx.fillStyle=C.bar;cx.fillRect(x,0,1,RULERH);
    cx.fillStyle=C.muted;cx.fillText(String(b/4+1),x+4,RULERH/2);
  }
  if(cxp>=KEYW&&cxp<=cw){cx.fillStyle=C.acc;cx.beginPath();cx.moveTo(cxp-5,0);cx.lineTo(cxp+5,0);cx.lineTo(cxp,8);cx.closePath();cx.fill();}
  cx.fillStyle=C.ruler;cx.fillRect(0,0,KEYW,RULERH);
}

function beatAt(x){return(x-KEYW+grid.scrollLeft)/pxBeat;}
function pitchAt(y){return Math.max(LO,Math.min(HI,HI-Math.floor((y-RULERH+grid.scrollTop)/ROWH)));}
function qFloor(b){return Math.max(0,Math.floor(b/snap+1e-6)*snap);}
function qRound(b){return Math.max(0,Math.round(b/snap)*snap);}
function noteAt(beat,pitch){
  const ns=S.tracks[cur].notes;
  for(let i=ns.length-1;i>=0;i--){const n=ns[i];if(n.p===pitch&&beat>=n.t&&beat<n.t+n.d)return n;}
  return null;
}

let drag=null;
const activePointers=new Map();

cv.addEventListener('pointerdown',e=>{
  ensureAudio();
  activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;

  if(activePointers.size>=2){
    const pts=[...activePointers.values()];
    drag={kind:'pan',sx:grid.scrollLeft,sy:grid.scrollTop,x0:(pts[0].x+pts[1].x)/2,y0:(pts[0].y+pts[1].y)/2};
    return;
  }
  if(y<RULERH){
    if(x>=KEYW&&!P.playing){S.cursor=qRound(beatAt(x));updPos(S.cursor);draw();}
    return;
  }
  if(x<KEYW){preview(pitchAt(y));return;}

  const tr=S.tracks[cur];
  const beat=beatAt(x),pitch=pitchAt(y);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}

  if(tr.inst==='audio'){
    drag={kind:'pan',sx:grid.scrollLeft,sy:grid.scrollTop,x0:e.clientX,y0:e.clientY};
    return;
  }

  const n=noteAt(beat,pitch);
  if(tool==='draw'){
    if(n){
      snapshot();
      const edge=Math.min(16,n.d*pxBeat*.4);
      const nx=KEYW+(n.t+n.d)*pxBeat-grid.scrollLeft;
      if(x>=nx-edge)drag={kind:'resize',n};
      else drag={kind:'move',n,off:beat-n.t};
    }else{
      drag={kind:'pendingDraw',sx:grid.scrollLeft,sy:grid.scrollTop,x0:e.clientX,y0:e.clientY,beat,pitch};
    }
  }else if(tool==='move'){
    if(n){
      snapshot();
      const edge=Math.min(16,n.d*pxBeat*.4);
      const nx=KEYW+(n.t+n.d)*pxBeat-grid.scrollLeft;
      drag={kind:x>=nx-edge?'resize':'move',n,off:beat-n.t};
    }else{
      drag={kind:'pan',sx:grid.scrollLeft,sy:grid.scrollTop,x0:e.clientX,y0:e.clientY};
    }
  }else if(tool==='erase'){
    if(n){snapshot();drag={kind:'erase',any:false};eraseAt(beat,pitch,drag);}
    else drag={kind:'pan',sx:grid.scrollLeft,sy:grid.scrollTop,x0:e.clientX,y0:e.clientY};
  }
});

function eraseAt(beat,pitch,d){
  const n=noteAt(beat,pitch);
  if(!n)return;
  const ns=S.tracks[cur].notes;ns.splice(ns.indexOf(n),1);d.any=true;draw();
}

cv.addEventListener('pointermove',e=>{
  if(activePointers.has(e.pointerId))activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(!drag)return;

  if(drag.kind==='pan'){
    grid.scrollLeft=Math.max(0,drag.sx-(e.clientX-drag.x0));
    grid.scrollTop=Math.max(0,drag.sy-(e.clientY-drag.y0));
    draw();
    return;
  }
  if(drag.kind==='pendingDraw'){
    const dx=e.clientX-drag.x0,dy=e.clientY-drag.y0;
    if(Math.hypot(dx,dy)>8){
      drag.kind='pan';
      grid.scrollLeft=Math.max(0,drag.sx-dx);
      grid.scrollTop=Math.max(0,drag.sy-dy);
      draw();
    }
    return;
  }

  const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,beat=beatAt(x);
  if(drag.kind==='resize')drag.n.d=Math.max(snap,qRound(beat)-drag.n.t);
  else if(drag.kind==='move'){
    drag.n.t=qRound(beat-drag.off);
    const p=pitchAt(y);
    if(p!==drag.n.p){drag.n.p=p;preview(p);}
  }else if(drag.kind==='erase')eraseAt(beat,pitchAt(y),drag);
  draw();
});

function endDrag(e){
  activePointers.delete(e.pointerId);
  if(!drag)return;
  if(drag.kind==='pendingDraw'){
    snapshot();
    S.tracks[cur].notes.push({t:qFloor(drag.beat),d:Math.max(snap,lastLen),p:drag.pitch,v:100});
    preview(drag.pitch);
  }
  drag=null;
  sizeRoll();renderSidebar();save();
}
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
grid.addEventListener('scroll',()=>{if(!P.playing)draw();},{passive:true});
new ResizeObserver(()=>sizeRoll()).observe(grid);

function drawMiniWave(){
  const wc=$('#waveCv');if(!wc)return;
  const ctx=wc.getContext('2d'),t=S.tracks[cur],buf=audioStore[t.uid];
  ctx.clearRect(0,0,wc.width,wc.height);
  if(!buf)return;
  const d=buf.getChannelData(0),step=Math.max(1,Math.floor(d.length/wc.width));
  ctx.strokeStyle='#10b981';ctx.beginPath();
  for(let x=0;x<wc.width;x++){
    const v=Math.abs(d[x*step]||0)*20;
    ctx.moveTo(x,22-v);ctx.lineTo(x,22+v);
  }
  ctx.stroke();
}

function toBase64(u8){
  let s='';
  for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));
  return btoa(s);
}
async function saveFile(name,bytes,mime){
  if(window.AndroidBridge&&window.AndroidBridge.save){
    window.AndroidBridge.save('data:'+mime+';base64,'+toBase64(bytes),mime,name);
    return;
  }
  const url=URL.createObjectURL(new Blob([bytes],{type:mime}));
  const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast('Mengunduh: '+name);
}
function readFile(file){
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(new Uint8Array(r.result));r.onerror=()=>rej(new Error('Gagal membaca file.'));r.readAsArrayBuffer(file);});
}

  });
  $('#expWav').addEventListener('click',renderWavNow);
  $('#expMidi').addEventListener('click',()=>{saveFile('melvox-project.mid',writeMidi(S.tracks,S.bpm),'audio/midi');});
  $('#expProj').addEventListener('click',()=>{
    const j=JSON.stringify({bpm:S.bpm,reverb:S.reverb,master:S.master,tracks:S.tracks});
    saveFile('melvox-project.json',new TextEncoder().encode(j),'application/json');
  });
  $('#expText').addEventListener('click',()=>{
    const t=S.tracks[cur];
    const rows=t.notes.slice().sort((a,b)=>a.t-b.t||a.p-b.p).map(n=>(Math.floor(n.t/4)+1)+'.'+(Math.round((n.t%4+1)*100)/100)+' '+noteName(n.p)+' ('+n.d+')');
    $('#noteText').value=t.name+' ('+S.bpm+' BPM)\n'+rows.join('\n');
  });
}

async function renderWavNow(){
  toast('Merender WAV...');
  try{
    const sr=44100,sec=songLen()*60/S.bpm+2.8;
    const OC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
    const oc=new OC(2,Math.ceil(sr*sec),sr);
    const eng=new Engine(oc,oc.destination,S);
    scheduleAll(eng,0,.05,false);
    const buf=await oc.startRendering();
    await saveFile('melvox-export.wav',encodeWav(buf.getChannelData(0),buf.getChannelData(1),sr),'audio/wav');
  }catch(err){toast('Gagal render WAV');}
}

document.querySelectorAll('#tools button').forEach(b=>b.addEventListener('click',()=>{
  tool=b.dataset.tool;
  document.querySelectorAll('#tools button').forEach(x=>x.setAttribute('aria-pressed',x===b));
}));
document.querySelectorAll('.rack-tabs button').forEach(b=>b.addEventListener('click',()=>{
  rackTab=b.dataset.rtab;
  document.querySelectorAll('.rack-tabs button').forEach(x=>x.setAttribute('aria-selected',x===b));
  renderRack();
}));
$('#toggleRack').addEventListener('click',()=>{
  const r=$('#rack');r.classList.toggle('collapsed');
  $('#toggleRack').classList.toggle('active',!r.classList.contains('collapsed'));
  sizeRoll();
});
$('#closeRack').addEventListener('click',()=>{
  $('#rack').classList.add('collapsed');
  $('#toggleRack').classList.remove('active');
  sizeRoll();
});
$('#snap').addEventListener('change',e=>{snap=+e.target.value;draw();});
function zoom(f){
  const c=(grid.scrollLeft+(cw-KEYW)/2)/pxBeat;
  pxBeat=Math.max(22,Math.min(180,Math.round(pxBeat*f)));
  sizeRoll();grid.scrollLeft=Math.max(0,c*pxBeat-(cw-KEYW)/2);draw();
}
$('#zoomIn').addEventListener('click',()=>zoom(1.3));
$('#zoomOut').addEventListener('click',()=>zoom(1/1.3));

$('#play').addEventListener('click',()=>{ensureAudio();P.playing?stopPlay():play();});
$('#rew').addEventListener('click',()=>{S.cursor=0;grid.scrollLeft=0;updPos(0);if(P.playing)play();else draw();});
$('#ffw').addEventListener('click',()=>{S.cursor=Math.min(songLen(),S.cursor+4);updPos(S.cursor);if(P.playing)play();else draw();});
$('#loop').addEventListener('click',e=>{loopOn=!loopOn;e.currentTarget.setAttribute('aria-pressed',loopOn);});
$('#metro').addEventListener('click',e=>{metroOn=!metroOn;e.currentTarget.setAttribute('aria-pressed',metroOn);});
$('#undo').addEventListener('click',undo);
$('#quickExport').addEventListener('click',renderWavNow);
$('#bpm').addEventListener('change',e=>{
  const v=Math.max(40,Math.min(220,Math.round(+e.target.value||S.bpm)));
  if(v!==S.bpm){snapshot();S.bpm=v;if(P.playing)stopPlay();save();}
  e.target.value=S.bpm;
});

let toastT=0;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.hidden=false;
  clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true;},3200);
}

function refreshAll(){
  $('#bpm').value=S.bpm;renderSidebar();renderRack();sizeRoll();updPos(S.cursor);
  const t=S.tracks[cur];
  if(t&&t.notes.length){
    const avg=t.notes.reduce((a,n)=>a+n.p,0)/t.notes.length;
    grid.scrollTop=Math.max(0,RULERH+(HI-avg)*ROWH-grid.clientHeight/2);
  }else{
    grid.scrollTop=Math.max(0,RULERH+(HI-64)*ROWH-grid.clientHeight/2);
  }
  grid.scrollLeft=0;draw();
}

if(!loadSaved())setSong(demoSong(),90);
refreshAll();
</script>
</body>
</html>
